<!doctype html>
<html lang="en">
  <head>
    <!-- Google Analytics will be loaded conditionally based on cookie consent -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    
    <!-- Technical SEO -->
    <title>Dipriva Consulting Group | Strategic Consulting for Operational Clarity</title>
    <meta name="description" content="Engineering operational clarity for growth-oriented businesses. Strategic consulting, startup operations, and AI-driven automation." />
    <meta name="robots" content="index, follow" />
    <!-- /client_form is excluded from indexing via server-side X-Robots-Tag header -->
    <link rel="canonical" href="https://www.dipriva.com" />
    
    <!-- Hreflang tags for bilingual SEO -->
    <link rel="alternate" hreflang="en" href="https://www.dipriva.com" />
    <link rel="alternate" hreflang="x-default" href="https://www.dipriva.com" />
    
    <!-- Open Graph / LinkedIn Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.dipriva.com" />
    <meta property="og:title" content="Dipriva Consulting Group | Strategic Consulting for Operational Clarity" />
    <meta property="og:description" content="Engineering operational clarity for growth-oriented businesses. Strategic consulting, startup operations, and AI-driven automation." />
    <meta property="og:site_name" content="Dipriva Consulting Group" />
    <meta property="og:image" content="https://www.dipriva.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Spanish OG Image -->
    <meta property="og:image:url" content="https://www.dipriva.com/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.dipriva.com" />
    <meta name="twitter:title" content="Dipriva Consulting Group | Strategic Consulting for Operational Clarity" />
    <meta name="twitter:description" content="Engineering operational clarity for growth-oriented businesses." />
    <meta name="twitter:image" content="https://www.dipriva.com/og-image.png" />

    <!-- Spanish Twitter Card Image -->
    <meta name="twitter:image:src" content="https://www.dipriva.com/og-image.png" />
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ProfessionalService",
          "@id": "https://www.dipriva.com/#organization",
          "name": "Dipriva Consulting Group",
          "url": "https://www.dipriva.com",
          "logo": "https://www.dipriva.com/og-image.png",
          "description": "Bilingual executive consulting in corporate strategy, startup operations, and AI-driven automation serving the West Michigan mid-market.",
          "founder": { "@id": "https://www.dipriva.com/#founder" },
          "areaServed": [
            { "@type": "City", "name": "Grand Rapids" },
            { "@type": "State", "name": "Michigan" }
          ],
          "knowsAbout": [
            "Corporate Strategy",
            "Startup Operations",
            "AI Automation",
            "Treasury Management",
            "Operational Due Diligence"
          ],
          "sameAs": [
            "https://www.linkedin.com/company/112996520"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "sales",
            "email": "manuel@dipriva.com",
            "availableLanguage": ["English", "Spanish"]
          }
        },
        {
          "@type": "Person",
          "@id": "https://www.dipriva.com/#founder",
          "name": "Manuel Diprés",
          "jobTitle": "Founder",
          "worksFor": { "@id": "https://www.dipriva.com/#organization" },
          "knowsLanguage": ["English", "Spanish"],
          "sameAs": ["https://www.linkedin.com/in/manueldipres/"]
        }
      ]
    }
    </script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
