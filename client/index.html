<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    
    <!-- Technical SEO -->
    <title>Dipriva Consulting Group | Strategic Consulting for Operational Clarity</title>
    <meta name="description" content="Engineering operational clarity for growth-oriented businesses. Strategic consulting, startup operations, and AI-driven automation." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.dipriva.com" />
    
    <!-- Open Graph / LinkedIn Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.dipriva.com" />
    <meta property="og:title" content="Dipriva Consulting Group | Strategic Consulting for Operational Clarity" />
    <meta property="og:description" content="Engineering operational clarity for growth-oriented businesses. Strategic consulting, startup operations, and AI-driven automation." />
    <meta property="og:site_name" content="Dipriva Consulting Group" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.dipriva.com" />
    <meta name="twitter:title" content="Dipriva Consulting Group | Strategic Consulting for Operational Clarity" />
    <meta name="twitter:description" content="Engineering operational clarity for growth-oriented businesses." />
    
    <!-- JSON-LD LocalBusiness Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Dipriva Consulting Group",
      "url": "https://www.dipriva.com",
      "description": "Engineering operational clarity for businesses built to grow",
      "sameAs": "https://www.linkedin.com/company/dipriva"
    }
    </script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
