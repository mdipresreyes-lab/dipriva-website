name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generate per-post OG images (1200×630 PNGs) into client/public/og/ before
      # the build so Vite copies them into dist/public/og/ automatically.
      - run: node scripts/generate-og-images.mjs

      # Regenerate the crawler-facing static HTML from content/blog/ before the
      # build, so Vite copies client/public/bot/ into dist/public/bot/ as part of
      # its normal public-directory pass. Running it after the build would write
      # into a source directory nothing reads again.
      - run: node scripts/generate-bot-html.mjs

      - run: npx vite build
        env:
          NODE_ENV: production

      # Write a real index.html at every client-side route. GitHub Pages returns
      # HTTP 200 only when a file exists at the requested path; routes without one
      # fall through to 404.html, which renders fine for humans but responds 404 so
      # crawlers will not index the page. Each file carries that route's own title,
      # description, canonical and JSON-LD, so metadata is correct before JS runs.
      - run: node scripts/prerender-routes.mjs dist/public

      # Fallback for URLs that match no route at all.
      - run: cp dist/public/index.html dist/public/404.html

      # /client_form is a private, direct-link-only page. GitHub Pages can't set
      # a per-path X-Robots-Tag header, so give it its own static file with
      # noindex baked into the raw HTML instead of relying solely on the
      # client-side meta-tag override in ClientForm.tsx.
      - run: |
          mkdir -p dist/public/client_form
          sed -e 's/content="index, follow"/content="noindex, nofollow"/' \
              dist/public/index.html > dist/public/client_form/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
